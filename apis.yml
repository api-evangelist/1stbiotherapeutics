aid: 1stbiotherapeutics
name: 1ST Biotherapeutics
description: '1ST Biotherapeutics (1STBIO) is a clinical-stage biopharmaceutical company
  founded in 2016 and headquartered in Gyeonggi-do, South Korea. It discovers and develops
  novel small-molecule therapeutics for areas of significant unmet medical need, with
  programs spanning neurodegenerative disease, immuno-oncology, metabolic disease and
  rare/orphan disease, supported by a genomics-based target discovery capability and an
  R&D network of academic, hospital, CRO and investor partners. The company sells no
  software product and operates no developer program: its public web presence is an
  eight-page corporate and investor site with no API, SDK, developer portal or
  machine-readable contract of any kind.'
